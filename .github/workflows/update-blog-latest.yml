name: Update latest blog post

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update blog-latest.json from blog feed
        run: node .github/scripts/update-blog-latest.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain blog-latest.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add blog-latest.json
            git commit -m 'Update blog-latest.json (latest blog post)'
            git push
          else
            echo 'No changes - blog-latest.json already current'
          fi
